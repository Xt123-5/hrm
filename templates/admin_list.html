{% extends 'layout.html' %}

{% block content %}
<div>
    <a class="btn btn-success" href="/admin/add/">
        <span class="glyphicon glyphicon-plus-sign"></span> 新建管理员
    </a>
</div>

<div class="panel panel-default" style="margin-top: 10px;">
    <div class="panel-heading">
        <span class="glyphicon glyphicon-th-list"></span> 管理员列表
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>密码</th>
            <th>重置密码</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        {% for obj in queryset %}
        <tr>
            <td>{{ obj.id }}</td>
            <td>{{ obj.username }}</td>
            <td>******</td>
            <td>
                <a href="/admin/{{ obj.id }}/reset/pwd/">重置密码</a>
            </td>
            <td>
                <a class="btn btn-primary btn-xs" href="/admin/{{ obj.id }}/edit/">编辑</a>
                <a class="btn btn-danger btn-xs" href="/admin/{{ obj.id }}/delete/"
                   onclick="return confirm('确定删除该管理员？')">删除</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    <div class="text-center">
        {{ page_string }}
    </div>
</div>
{% endblock %}
