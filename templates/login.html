{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.min.css' %}">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 100px;">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title text-center">用户登录</h3>
        </div>
        <div class="panel-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" class="form-control" placeholder="密码">
                </div>
                <div class="form-group">
                    <label>图片验证码</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" name="code" class="form-control" placeholder="验证码" style="flex: 1;">
                        <img src="/image/code/" onclick="this.src='/image/code/?'+Math.random()"
                             style="height: 34px; cursor: pointer;" title="点击刷新">
                    </div>
                </div>
                {% if error %}
                <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
