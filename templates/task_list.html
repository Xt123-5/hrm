{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">任务管理（AJAX）</div>
    <div class="panel-body">
        <form id="taskForm">
            <div class="row">
                <div class="col-sm-3">
                    <label>级别</label>
                    <select name="level" class="form-control">
                        <option value="1">紧急</option>
                        <option value="2">重要</option>
                        <option value="3">普通</option>
                    </select>
                </div>
                <div class="col-sm-5">
                    <label>标题</label>
                    <input type="text" name="title" class="form-control" placeholder="标题">
                </div>
                <div class="col-sm-4">
                    <label>负责人</label>
                    <select name="owner" class="form-control">
                        {% for emp in owner_list %}
                        <option value="{{ emp.id }}">{{ emp.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row" style="margin-top: 10px;">
                <div class="col-sm-12">
                    <label>详细信息</label>
                    <textarea name="detail" class="form-control" rows="2" placeholder="详细信息"></textarea>
                </div>
            </div>
            <div class="row" style="margin-top: 10px;">
                <div class="col-sm-12">
                    <button type="button" id="submitBtn" class="btn btn-primary">提交</button>
                    <span id="msg" style="margin-left: 10px; color: red;"></span>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="panel panel-default">
    <div class="panel-body">
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>级别</th>
                    <th>标题</th>
                    <th>详细信息</th>
                    <th>负责人</th>
                </tr>
            </thead>
            <tbody>
                {% for obj in queryset %}
                <tr>
                    <td>{{ obj.id }}</td>
                    <td>{{ obj.get_level_display }}</td>
                    <td>{{ obj.title }}</td>
                    <td>{{ obj.detail }}</td>
                    <td>{{ obj.owner.name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $("#submitBtn").click(function () {
        $.ajax({
            url: "/task/ajax/",
            type: "POST",
            data: {
                level: $("select[name=level]").val(),
                title: $("input[name=title]").val(),
                detail: $("textarea[name=detail]").val(),
                owner: $("select[name=owner]").val(),
            },
            dataType: "JSON",
            success: function (res) {
                if (res.status) {
                    $("#msg").css("color", "green").text(res.msg);
                    setTimeout(function(){ location.reload(); }, 1000);
                } else {
                    $("#msg").css("color", "red").text("提交失败，请检查输入");
                    console.log(res.msg);
                }
            }
        })
    })
</script>
{% endblock %}
